[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-battery-life"
version = "0.1.0"
description = "Reproducible battery lifetime model for low-power IoT devices"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Seyed Mohammad Hossein Nabavi"},
  {name = "Somayeh Hajforoosh"},
  {name = "Seyed Mohammad Amin Nabavi"}
]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iot-battery-life = "iot_battery_life.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iot_battery_life = ["data/*.csv"]
